<section class="hero">

  <h1>Text Case Converter</h1>

  <p>
    Quickly convert your text to uppercase, lowercase, title case,
    sentence case, and more.
  </p>

</section>

<main class="container">

  <div class="tool-box">

    <label for="textInput">Enter Your Text</label>

    <textarea
      id="textInput"
      placeholder="Type or paste your text here..."
    ></textarea>

    <div class="buttons">

      <button onclick="convertUppercase()">
        UPPERCASE
      </button>

      <button onclick="convertLowercase()">
        lowercase
      </button>

      <button onclick="convertTitleCase()">
        Title Case
      </button>

      <button onclick="convertSentenceCase()">
        Sentence case
      </button>

      <button onclick="convertAlternatingCase()">
        aLtErNaTiNg CaSe
      </button>

      <button class="secondary" onclick="clearText()">
        Clear
      </button>

    </div>

    <div class="output-box" id="outputBox">

      <h3>Converted Text</h3>

      <div class="output" id="output"></div>

      <button onclick="copyText()">
        Copy Text
      </button>

    </div>

  </div>

</main>

<script>

function getText() {
  return document.getElementById("textInput").value;
}

function showOutput(text) {
  document.getElementById("output").textContent = text;
  document.getElementById("outputBox").style.display = "block";
}

function convertUppercase() {
  showOutput(getText().toUpperCase());
}

function convertLowercase() {
  showOutput(getText().toLowerCase());
}

function convertTitleCase() {

  const text = getText().toLowerCase();

  const result = text.replace(/\b\w/g, function(char) {
    return char.toUpperCase();
  });

  showOutput(result);
}

function convertSentenceCase() {

  const text = getText().toLowerCase();

  const result = text.replace(
    /(^\s*\w|[.!?]\s+\w)/g,
    function(char) {
      return char.toUpperCase();
    }
  );

  showOutput(result);
}

function convertAlternatingCase() {

  const text = getText();

  let result = "";
  let letterIndex = 0;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    if (/[a-zA-Z]/.test(char)) {

      if (letterIndex % 2 === 0) {
        result += char.toLowerCase();
      } else {
        result += char.toUpperCase();
      }

      letterIndex++;

    } else {

      result += char;
    }
  }

  showOutput(result);
}

function copyText() {

  const output = document.getElementById("output").textContent;

  navigator.clipboard.writeText(output).then(function() {
    alert("Text copied successfully!");
  });
}

function clearText() {

  document.getElementById("textInput").value = "";

  document.getElementById("output").textContent = "";

  document.getElementById("outputBox").style.display = "none";
}

</script>
