<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keyword Density Checker - Free SEO Tool</title>

  <meta name="description" content="Use our free Keyword Density Checker to analyze keyword frequency, density percentage, and word count in your content.">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://haqnawazrehan05-ai.github.io/seo-tools-hub/tools/keyword-density-checker.html">

  <style>
    * {
      box-sizing: border-box;

    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #172033;

    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5eaf2;
      padding: 18px 20px;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #172033;
      text-decoration: none;
    }

    .logo span {
      color: #2864e8;
    }

    nav a {
      text-decoration: none;
      color: #172033;
      margin-left: 25px;
      font-weight: 600;
    }

    nav a:hover {
      color: #2864e8;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #2864e8;
    }

    .hero p {
      color: #60708a;
      font-size: 17px;
    }

    .tool-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(30, 50, 90, 0.08);
      border: 1px solid #e7ebf3;

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      padding: 15px;
      border: 1px solid #ccd5e3;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2864e8;
    }

    .button-row {
      margin-top: 18px;
    }

    button {
      background: #2864e8;
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 8px;

      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1f52c7;
    }

    .results {
      margin-top: 30px;
      display: none;
    }

    .results h2 {

    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #f5f8ff;
      border: 1px solid #e0e7f5;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;

    }

    .keyword-table {
      width: 100%;
      border-collapse: collapse;

    .keyword-table th,
    .keyword-table td {

    .keyword-table th {

    footer {
      margin-top: 70px;

    @media (max-width: 700px) {
      .nav {
        flex-direction: column;
        gap: 15px;
      }

      nav a {

      }

      .hero h1 {

      .stats {
        grid-template-columns: 1fr;
      }

<body>

<header>
  <div class="nav">
    <a href="../index.html" class="logo">
      <span>SEO</span> Tools Hub
    </a>

    <nav>
      <a href="../index.html">Home</a>
      <a href="keyword-density-checker.html">SEO Tools</a>
      <a href="../blog/index.html">Blog</a>
      <a href="../about.html">About</a>
      <a href="../contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Keyword <span>Density Checker</span></h1>
    <p>
      Analyze keyword frequency and density in your content with our free SEO tool.
    </p>
  </section>

  <section class="tool-box">

    <label for="content">Enter or paste your content</label>

    <textarea
      id="content"
      placeholder="Paste your article or content here..."
    ></textarea>

    <div class="button-row">
      <button onclick="checkKeywordDensity()">
        Check Keyword Density
      </button>
    </div>

    <div class="results" id="results">

      <h2>Keyword Density Results</h2>

      <div class="stats">
        <div class="stat">
          <strong id="wordCount">0</strong>
          Total Words
        </div>

        <div class="stat">
          <strong id="uniqueWords">0</strong>
          Unique Words
        </div>

        <div class="stat">
          <strong id="keywordCount">0</strong>
          Keywords Found
        </div>
      </div>

      <table class="keyword-table">
        <thead>
          <tr>
            <th>Keyword</th>
            <th>Count</th>
            <th>Density</th>
          </tr>
        </thead>

        <tbody id="keywordResults"></tbody>
      </table>

    </div>

  </section>

</main>

<footer>
  <p>© 2026 SEO Tools Hub. All rights reserved.</p>
</footer>

<script>
function checkKeywordDensity() {

  const content = document.getElementById("content").value.trim();

  if (!content) {
    alert("Please enter some content first.");
    return;
  }

  const words = content
    .toLowerCase()
    .replace(/[^\w\s'-]/g, "")
    .split(/\s+/)
    .filter(Boolean);

  const wordCount = words.length;

  const frequency = {};

  words.forEach(word => {
    frequency[word] = (frequency[word] || 0) + 1;
  });

  const sortedWords = Object.entries(frequency)
    .sort((a, b) => b[1] - a[1]);

  document.getElementById("wordCount").textContent = wordCount;
  document.getElementById("uniqueWords").textContent = sortedWords.length;
  document.getElementById("keywordCount").textContent = sortedWords.length;

  const results = document.getElementById("keywordResults");

  results.innerHTML = "";

  sortedWords.slice(0, 30).forEach(([word, count]) => {

    const density = ((count / wordCount) * 100).toFixed(2);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHTML(word)}</td>
      <td>${count}</td>
      <td>${density}%</td>
    `;

    results.appendChild(row);
  });

  document.getElementById("results").style.display = "block";
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>

</body>
</html>
